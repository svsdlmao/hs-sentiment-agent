# HengSeng / KRX social-sentiment price-prediction agent — run configuration.
# Every value here can be changed without touching code.

[run]
lookback_days = 10          # social + news window (task: "last 10 days")
price_history_days = 365    # daily bars used for technical levels and the price-only base model
output_dir = "outputs"

[apify]
# Official Apify actor. All social pages AND the price bars are fetched through it.
actor_id = "apify/cheerio-scraper"
# [] = Apify datacenter proxy. Use ["RESIDENTIAL"] if a site starts blocking datacenter IPs.
proxy_groups = []
max_concurrency = 8
memory_mbytes = 1024
timeout_secs = 1800

[exa]
num_results = 12
max_characters = 1200

[limits]
naver_page_size = 100       # posts per Naver API page (max 100)
naver_max_pages = 900       # per ticker; Samsung/SK hynix boards need ~750 pages for 10 days. Capped boards are flagged in the report
lihkg_max_search_pages = 3  # 30 threads per page
lihkg_threads_per_page = 12 # most-replied threads per search page whose replies are fetched
telegram_max_pages = 4      # 20 messages per page, per channel x keyword

# ---------------------------------------------------------------------------
# Exchanges. Each one uses two different social sources from the task list.
# ---------------------------------------------------------------------------

[[exchanges]]
code = "HKEX"
name = "Hong Kong Exchange (Hang Seng)"
tz = "Asia/Hong_Kong"
close_local = "16:00"
index_symbol = "^HSI"
sources = ["lihkg", "telegram"]
# Public channels with a web preview at https://t.me/s/<name>; searched per keyword.
telegram_channels = ["hkej_news", "mingpao_news", "reuterszh", "jin10data"]

