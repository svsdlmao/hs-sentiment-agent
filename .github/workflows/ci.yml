name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python deps
        run: pip install -r requirements.txt anthropic
      - name: Install page-function test harness (cheerio)
        run: npm ci --prefix tests/js
      - name: Unit + JS/Python parity tests
        run: python -m pytest -q
